<text x="259" y="344" font-size="17">“Jolt” was blocked to protect your Mac.</text>
<rect x="599" y="358" width="160" height="36" rx="9" fill="#fff" stroke="#c6c6c8"/><rect x="593" y="352" width="172" height="48" rx="13" fill="none" stroke="#0067d9" stroke-width="4"/><text x="679" y="382" text-anchor="middle" font-size="19">Open Anyway</text>
<text x="259" y="424" font-size="14" fill="#666">Apple could not verify “Jolt” is free of malware that may</text><text x="259" y="444" font-size="14" fill="#666">harm your Mac or compromise your privacy.</text>
<text x="510" y="498" text-anchor="middle" font-size="17" font-weight="600" fill="#0055b3">2. Click Open Anyway</text></g></svg>